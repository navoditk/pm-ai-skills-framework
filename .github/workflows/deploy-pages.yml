name: Deploy Curriculum to GitHub Pages & Artifacts

on:
  push:
    branches: [main]
    paths:
      - "skills/skillevaluator-mastery/**"
      - "docs/15_SKILLS_AND_SKILLEVALUATOR_REFERENCE.md"
      - "docs/16_SKILLEVALUATOR_MASTERY.md"
      - "scripts/build_curriculum_pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pyyaml

      - name: Build Curriculum HTML Pages & Standalone Artifact
        run: python scripts/build_curriculum_pages.py

      - name: Upload Single-File Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillevaluator-mastery-standalone-html
          path: public/skillevaluator-mastery-standalone.html
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
