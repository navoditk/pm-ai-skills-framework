name: Registry Index

# Pulled forward from Milestone 12 (docs/10_DEVELOPMENT_ROADMAP_AND_PROGRESS.md,
# "Following PR -- Lightweight registry"): catalogs/skill-registry.json is the
# artifact that actually prevents duplicate skill-building going forward, not
# just detects it after the fact the way the similarity CI gate does at PR
# time -- so it needs to stay current on main, not just be regenerated by
# hand. Runs on merge, not on every PR: the index reflects the state of main,
# and regenerating it on a PR's branch would commit into the wrong history.
#
# Zero API cost: framework/registry/generate_index.py only reads
# already-committed files (catalogs/skill-catalog.json, each skill.yaml,
# each BENCHMARK.json) and does not call any embedding or LLM provider.
on:
  push:
    branches: [main]
    paths:
      - "skills/**/skill.yaml"
      - "skills/**/BENCHMARK.json"
      - "catalogs/skill-catalog.json"
      - "framework/registry/generate_index.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Guard against an infinite loop: skip commits this job itself made.
    if: "!contains(github.event.head_commit.message, '[skip registry]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Regenerate catalogs/skill-registry.json
        run: python framework/registry/generate_index.py

      - name: Commit if changed
        run: |
          set -e
          if git diff --quiet -- catalogs/skill-registry.json; then
            echo "Registry index unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogs/skill-registry.json
          git commit -m "Regenerate skill registry index [skip registry]"
          git push
