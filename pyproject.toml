[project]
name = "pm-ai-skills-framework-blueprint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0,<5",
    "pyyaml>=6.0,<7",
]

[project.scripts]
pmai-skills = "framework.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*", "graders*"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
