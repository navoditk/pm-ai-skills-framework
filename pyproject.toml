[project]
name = "pm-ai-skills-framework-blueprint"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.0,<5",
    "pyyaml>=6.0,<7",
]

[project.scripts]
pmai-skills = "framework.cli.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*", "graders*"]

[project.optional-dependencies]
dev = ["markdown>=3.6,<4", "pytest>=8,<9", "ruff>=0.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E402 is enabled deliberately. The eval scripts under skills/*/evals/ insert
# the repo root on sys.path before importing framework modules, and carry
# `# noqa: E402` on those imports. Without the rule enabled those directives
# read as unused (RUF100) and `ruff check --fix` deletes them -- removing
# correct annotations and leaving the next person to rediscover why the
# imports are placed where they are.
extend-select = ["E402", "I", "UP", "SIM", "RUF"]
