version: 2

# Risk-tiered certification rigor (docs/04_EVALUATION_AND_CERTIFICATION.md
# §4.2a). A skill's classification.risk_level in skill.yaml selects its
# profile below via risk_level_profiles -- certification rigor scales with
# downstream risk instead of every skill paying the same cost. Tier 1/Tier 2
# stay blocking at every level (cheap, so no reason to relax them); what
# scales is Tier 3 attempt count/case coverage (evaluation_requirements
# below -- descriptive, enforced by each skill's evals/config.yml, not by
# this engine) and whether Tier 4 finance-grader metrics are a weighted
# minimum_metric, a hard_gate, or merely recommended.
risk_level_profiles:
  informational: informational-standard
  low: low-standard
  analytical: analytical-standard
  decision-support: decision-support-standard
  action: action-standard

profiles:
  informational-standard:
    # Tier 4 finance grading: optional. A summary/commentary skill with no
    # numeric financial claims to check has nothing for these graders to do.
    evaluation_requirements:
      tier3_attempts: 1
      tier3_case_set: reduced

    hard_gates:
      security: pass
      authorization: pass

    minimum_metrics:
      correctness: 0.90
      discoverability: 0.85
      effectiveness: 0.85
      skill_lift_overall: 0.05

  low-standard:
    # Tier 4 finance grading: recommended if the skill makes numeric
    # financial claims, but not a certification gate -- a skill this
    # profile covers may legitimately have nothing for those graders to
    # check (e.g. a pure lookup/formatting skill).
    evaluation_requirements:
      tier3_attempts: 1
      tier3_case_set: full

    hard_gates:
      security: pass
      authorization: pass
      regression_pass_rate: 1.0
      data_provenance: 1.0

    minimum_metrics:
      correctness: 0.92
      discoverability: 0.88
      effectiveness: 0.88
      efficiency: 0.70
      skill_lift_overall: 0.08

  analytical-standard:
    # Tier 4 finance grading: required, as a weighted minimum_metric --
    # this is the profile all 12 real reference skills currently use.
    evaluation_requirements:
      tier3_attempts: "1-3"
      tier3_case_set: full

    hard_gates:
      security: pass
      authorization: pass
      regression_pass_rate: 1.0
      data_provenance: 1.0

    minimum_metrics:
      correctness: 0.95
      discoverability: 0.90
      effectiveness: 0.90
      efficiency: 0.75
      skill_lift_overall: 0.10
      financial_accuracy: 0.98
      temporal_consistency: 0.99
      # 'reconciliation' deliberately dropped 2026-08-31 (see
      # docs/10_DEVELOPMENT_ROADMAP_AND_PROGRESS.md "Open policy decisions
      # pending human review"): it checks return-component math specific to
      # Performance Attribution's own attribution_reconciliation grader.
      # framework/certification/engine.py treats any minimum_metric absent
      # from a skill's metrics dict as an automatic failure, so keeping this
      # here auto-failed every skill except Performance Attribution
      # regardless of quality -- confirmed on Portfolio Overview's real
      # certification run. Skills that DO compute reconciliation (currently
      # only Performance Attribution) still report and check it internally
      # via their own composite grader; this profile just stops treating it
      # as a universal certification gate.

  decision-support-standard:
    # Tier 4 finance grading: required as a hard_gate, not a weighted
    # minimum_metric -- financial_accuracy/temporal_consistency must pass
    # outright and cannot be offset by a strong composite score elsewhere.
    evaluation_requirements:
      tier3_attempts: 3
      tier3_case_set: full

    hard_gates:
      security: pass
      authorization: pass
      regression_pass_rate: 1.0
      data_provenance: 1.0
      financial_accuracy: 0.98
      temporal_consistency: 0.99

    minimum_metrics:
      correctness: 0.95
      discoverability: 0.92
      effectiveness: 0.92
      efficiency: 0.80
      skill_lift_overall: 0.12

  action-standard:
    # Highest rigor: same hard-gated Tier 4 grading as decision-support,
    # tighter thresholds, plus a human-in-the-loop sign-off. No metrics
    # collector in this repo produces human_review_required, so an
    # action-tier skill cannot self-certify from automated evidence alone
    # by design -- a human must record that gate's outcome before this
    # profile can pass. No skill in this repo currently uses risk_level:
    # action; this profile exists so the mechanism is ready if one is added.
    evaluation_requirements:
      tier3_attempts: "3+"
      tier3_case_set: full
      trajectory_review: human

    hard_gates:
      security: pass
      authorization: pass
      regression_pass_rate: 1.0
      data_provenance: 1.0
      financial_accuracy: 0.99
      temporal_consistency: 1.0
      human_review_required: true

    minimum_metrics:
      correctness: 0.97
      discoverability: 0.92
      effectiveness: 0.92
      efficiency: 0.80
      skill_lift_overall: 0.12
